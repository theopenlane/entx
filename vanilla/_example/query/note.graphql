

query GetAllNotes($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [NoteOrder!]){
  notes(
    first: $first
    last: $last
    after: $after
    before: $before
    orderBy: $orderBy
  ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        id
        text
      }
    }
  }
}
query GetNoteByID($noteId: ID!) {
  note(id: $noteId) {
    id
    text
  }
}

query GetNotes($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: [NoteOrder!], $where: NoteWhereInput) {
  notes(
      first: $first
      last: $last
      after: $after
      before: $before
      orderBy: $orderBy
      where: $where
    ) {
    totalCount
    pageInfo {
      startCursor
      endCursor
      hasPreviousPage
      hasNextPage
    }
    edges {
      node {
        id
        text
      }
    }
  }
}
