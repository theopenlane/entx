extend type Query {
    """
    Look up note by ID
    """
     note(
        """
        ID of the note
        """
        id: ID!
    ):  Note!
}

extend type Mutation{
    """
    Create a new note
    """
    createNote(
        """
        values of the note
        """
        input: CreateNoteInput!
    ): NoteCreatePayload!
    """
    Create multiple new notes
    """
    createBulkNote(
        """
        values of the note
        """
        input: [CreateNoteInput!]
    ): NoteBulkCreatePayload!
    """
    Create multiple new notes via file upload
    """
    createBulkCSVNote(
        """
        csv file containing values of the note
        """
        input: Upload!
    ): NoteBulkCreatePayload!
    """
    Update multiple existing notes
    """
    updateBulkNote(
        """
        IDs of the notes to update
        """
        ids: [ID!]!
        """
        values to update the notes with
        """
        input: UpdateNoteInput!
    ): NoteBulkUpdatePayload!
    """
    Update multiple existing notes via file upload
    """
    updateBulkCSVNote(
        """
        csv file containing values of the note, must include ID column
        """
        input: Upload!
    ): NoteBulkUpdatePayload!
    """
    Update an existing note
    """
    updateNote(
        """
        ID of the note
        """
        id: ID!
        """
        New values for the note
        """
        input: UpdateNoteInput!
    ): NoteUpdatePayload!
    """
    Delete an existing note
    """
    deleteNote(
        """
        ID of the note
        """
        id: ID!
    ): NoteDeletePayload!
    """
    Delete multiple notes
    """
    deleteBulkNote(
        """
        IDs of the notes to delete
        """
        ids: [ID!]!
    ): NoteBulkDeletePayload!
}

"""
Return response for createNote mutation
"""
type NoteCreatePayload {
    """
    Created note
    """
    note: Note!
}

"""
Return response for updateNote mutation
"""
type NoteUpdatePayload {
    """
    Updated note
    """
    note: Note!
}

"""
Return response for deleteNote mutation
"""
type NoteDeletePayload {
    """
    Deleted note ID
    """
    deletedID: ID!
}

"""
Return response for createBulkNote mutation
"""
type NoteBulkCreatePayload {
    """
    Created notes
    """
    notes: [Note!]
}

"""
Return response for updateBulkNote mutation
"""
type NoteBulkUpdatePayload {
    """
    Updated notes
    """
    notes: [Note!]
    """
    IDs of the updated notes
    """
    updatedIDs: [ID!]
    """
    IDs that were not updated
    """
    notUpdatedIDs: [ID!]!
    """
    Error message when the bulk update did not apply to every requested ID
    """
    error: String
}

"""
Return response for deleteBulkNote mutation
"""
type NoteBulkDeletePayload {
    """
    Deleted note IDs
    """
    deletedIDs: [ID!]!
    """
    Error returned when the bulk delete is only partially applied
    """
    error: String
    """
    IDs of notes that were not deleted
    """
    notDeletedIDs: [ID!]
}
